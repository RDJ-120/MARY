<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>كل عام وأنتِ بخير يا مارلين</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #5b3a4d;
      --rose: #d9788f;
      --rose-soft: #f6c9d3;
      --gold: #c8a24e;
      --paper: rgba(255, 255, 255, 0.86);
      --box: min(90vw, 440px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    body {
      font-family: "Amiri", "Noto Naskh Arabic", serif;
      color: var(--ink);
      -webkit-tap-highlight-color: transparent;
    }

    /* ---------- Background: white + random soft shapes ---------- */
    .shapes {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: radial-gradient(90% 60% at 50% 0%, #fff4f7 0%, #ffffff 70%);
    }

    .shape {
      position: absolute;
      background: var(--c);
      opacity: 0.6;
      animation: floaty var(--dur) ease-in-out infinite;
      will-change: transform;
    }

    .s-circle  { border-radius: 50%; }
    .s-ring    { border-radius: 50%; background: transparent; border: 3px solid var(--c); }
    .s-blob    { border-radius: 63% 37% 54% 46% / 55% 48% 52% 45%; }
    .s-star    { clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
    .s-diamond { clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
    .s-plus    { clip-path: polygon(35% 0, 65% 0, 65% 35%, 100% 35%, 100% 65%, 65% 65%, 65% 100%, 35% 100%, 35% 65%, 0 65%, 0 35%, 35% 35%); }

    @keyframes floaty {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
      50% { transform: translate3d(var(--fx), var(--fy), 0) rotate(var(--fr)); }
    }

    /* ---------- Falling petals (after the tree) ---------- */
    .petals {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .petal {
      position: absolute;
      top: -30px;
      background: var(--c);
      border-radius: 100% 0 100% 0;
      opacity: 0;
      animation: petalFall var(--dur) linear forwards;
      will-change: transform, opacity;
    }

    @keyframes petalFall {
      0%   { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.85; }
      90%  { opacity: 0.85; }
      100% { transform: translate3d(var(--dx), calc(100dvh + 60px), 0) rotate(var(--rot)); opacity: 0; }
    }

    /* ---------- Pages ---------- */
    .page {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transform: translateY(12px) scale(0.985);
      transition: opacity 0.7s ease, transform 0.7s ease, visibility 0s linear 0.7s;
    }

    .page.active {
      opacity: 1;
      visibility: visible;
      transform: none;
      transition-delay: 0s;
    }

    /* ---------- Music toggle ---------- */
    .music-toggle {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      left: 12px;
      z-index: 6;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1.5px solid var(--rose-soft);
      background: rgba(255, 255, 255, 0.9);
      color: var(--rose);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(217, 120, 143, 0.25);
    }

    .music-toggle svg { width: 18px; height: 18px; }
    .music-toggle .slash { display: none; }
    .music-toggle.off .slash { display: block; }
    .music-toggle.off { opacity: 0.6; }

    /* ---------- Tree page ---------- */
    .tree-hint {
      font-family: "Aref Ruqaa", "Amiri", serif;
      font-size: 1.9rem;
      color: var(--rose);
      text-align: center;
      animation: hintPulse 2.8s ease-in-out infinite;
      transition: opacity 0.8s;
    }

    .tree-hint.gone { opacity: 0; animation: none; }

    @keyframes hintPulse {
      0%, 100% { opacity: 0.55; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-4px); }
    }

    .tree-btn {
      background: none;
      border: none;
      cursor: pointer;
      outline: none;
      width: min(86vw, 340px);
      margin-top: 8px;
    }

    .tree-btn:focus-visible {
      outline: 3px solid var(--rose);
      outline-offset: 6px;
      border-radius: 12px;
    }

    .tree-btn svg {
      width: 100%;
      height: auto;
      max-height: 58dvh;
      overflow: visible;
      display: block;
    }

    #branches path { stroke: #b58d80; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    #tree-g { transform: scale(0.72); transform-origin: 120px 292px; }

    .bloom {
      transform: scale(0);
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 1.3s cubic-bezier(0.25, 0.8, 0.3, 1), opacity 1.1s ease-out;
    }

    .bloom.on { transform: scale(1); opacity: 1; }

    .tree-ground { fill: var(--rose-soft); opacity: 0.9; }
    .tree-btn:not(.growing) .tree-ground { animation: groundPulse 2.6s ease-in-out infinite; }

    @keyframes groundPulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }

    /* ---------- Poem cards (swipe) ---------- */
    #pageCards { justify-content: flex-start; }

    .track {
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .track::-webkit-scrollbar { display: none; }

    .card {
      flex: 0 0 100%;
      scroll-snap-align: center;
      scroll-snap-stop: always;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(env(safe-area-inset-top, 0px) + 64px) 0 12px;
    }

    .paper {
      width: var(--box);
      max-height: 100%;
      overflow-y: auto;
      text-align: center;
      background: var(--paper);
      border: 1.5px solid var(--rose-soft);
      border-radius: 26px;
      padding: 30px 22px 26px;
      box-shadow: 0 10px 30px rgba(217, 120, 143, 0.16);
      scrollbar-width: none;
    }

    .paper::-webkit-scrollbar { display: none; }

    .orn {
      display: block;
      color: var(--gold);
      font-size: 1.15rem;
      letter-spacing: 0.5em;
      margin-bottom: 14px;
    }

    .line {
      display: block;
      font-size: clamp(1.18rem, 5.3vw, 1.45rem);
      line-height: 2.1;
      font-weight: 400;
      opacity: 0;
      transform: translateY(10px);
    }

    .sep {
      display: block;
      color: var(--gold);
      font-size: 1rem;
      margin: 10px 0;
      opacity: 0;
    }

    .card.in .line {
      opacity: 1;
      transform: none;
      transition: opacity 0.9s ease var(--d), transform 0.9s ease var(--d);
    }

    .card.in .sep {
      opacity: 0.9;
      transition: opacity 0.9s ease var(--d);
    }

    /* intro + closing */
    .eyebrow {
      font-size: 1.3rem;
      color: var(--gold);
      margin-bottom: 6px;
    }

    .big-name {
      font-family: "Aref Ruqaa", "Amiri", serif;
      font-size: clamp(3.4rem, 19vw, 5.2rem);
      line-height: 1.7;
      background: linear-gradient(110deg, #d9788f 10%, #e9a3b4 45%, #c8a24e 80%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sub {
      font-size: 1.2rem;
      color: var(--ink);
      opacity: 0.8;
      margin-top: 4px;
    }

    .swipe-hint {
      margin-top: 18px;
      font-size: 1.05rem;
      color: var(--rose);
      animation: hintPulse 2.6s ease-in-out infinite;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 7px;
      padding: 8px 0 calc(env(safe-area-inset-bottom, 0px) + 18px);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 99px;
      border: none;
      background: var(--rose-soft);
      cursor: pointer;
      padding: 0;
      transition: width 0.35s ease, background 0.35s ease;
    }

    .dot.on { width: 22px; background: var(--rose); }

    /* ---------- Cake ---------- */
    .cake-btn {
      background: none;
      border: none;
      cursor: pointer;
      outline: none;
      width: min(60vw, 230px);
      margin: 4px auto 6px;
      display: block;
    }

    .cake-btn svg { width: 100%; height: auto; display: block; overflow: visible; }

    .flame {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: flicker 0.25s ease-in-out infinite alternate;
    }

    @keyframes flicker {
      from { transform: scale(1, 1) rotate(-3deg); }
      to { transform: scale(0.92, 1.1) rotate(3deg); }
    }

    .cake-btn.out .flame { animation: none; opacity: 0; transform: scale(0.2); transition: opacity 0.5s ease, transform 0.5s ease; }

    .wish-line { transition: opacity 0.8s ease; }

    /* ---------- Confetti + tap flowers ---------- */
    .fx {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      overflow: hidden;
    }

    .confetto { position: absolute; }

    .tap-flower {
      position: fixed;
      z-index: 21;
      pointer-events: none;
      line-height: 1;
      transform: translate(-50%, -50%);
    }

    @media (prefers-reduced-motion: reduce) {
      .shape, .flame { animation: none; }
      .page { transition-duration: 0.01s; }
    }
  </style>
</head>

<body>
  <div class="shapes" id="shapes" aria-hidden="true"></div>
  <div class="petals" id="petals" aria-hidden="true"></div>
  <div class="fx" id="fx" aria-hidden="true"></div>

  <button class="music-toggle" id="musicToggle" aria-label="الموسيقى">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 3v11.3A3.5 3.5 0 1 0 11 17.5V7h6V3z"/><path class="slash" d="M3 3l18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
  </button>

  <!-- The song -->
  <audio id="bgm" src="song.mp3" loop preload="auto"></audio>

  <!-- Page 1: tree -->
  <section class="page active" id="pageTree">
    <p class="tree-hint" id="treeHint">المسي الشجرة</p>
    <button class="tree-btn" id="treeBtn" aria-label="المسي الشجرة">
      <svg viewBox="0 0 240 320" aria-hidden="true">
        <ellipse class="tree-ground" cx="120" cy="296" rx="100" ry="10"/>
        <g id="tree-g">
          <g id="branches"></g>
          <g id="blooms"></g>
        </g>
      </svg>
    </button>
  </section>

  <!-- Page 2: swipeable poems -->
  <section class="page" id="pageCards">
    <div class="track" id="track"></div>
    <div class="dots" id="dots"></div>
  </section>

  <script>
    // The name signed at the end of the greeting
    const SENDER = "عنب";

    // Poems, one array per card. "---" draws a small ornament between two poems.
    const POEMS = [
      [
        "يجثو لها الوردُ إجلالًا وإكبارا",
        "ويغبطُ البدرُ وجهًا زادَهُ حُسنًا ووقارا",
        "كأنّها من ضياءِ الفجرِ قد خُلقت",
        "ومن نُبلِ القصائدِ صيغتْ أزهارا"
      ],
      [
        "في يومِ ميلادِها تتلعثمُ الحروفُ حياءً",
        "وتطأطئُ النجومُ رؤوسَها استحياءً",
        "فكيف للشعرِ أن يصفَ جمالَها",
        "وقد غدا الحُسنُ في عينيها أشعارا"
      ],
      [
        "يا فاتنةَ الحُسنِ، يا بهجةَ العمرِ",
        "يا قصيدةً أضاعتْ في وصفِها الأقلامُ أفكارا",
        "كلُّ عامٍ وأنتِ للبهاءِ عنوانٌ",
        "وللرِّقّةِ سلطانٌ، وللجمالِ أسرارا"
      ],
      [
        "أدامَ اللهُ ابتسامةً تُزهرُ لها الأيامُ",
        "وعينينِ لو أبصرتهما النجومُ لاستعارتا أنوارا",
        "وروحًا كالغيثِ إن جفّتْ مشاعرُنا",
        "وكالربيعِ إذا ما الشتاءُ توارى"
      ],
      [
        "أسألُ الإلهَ أن يكسوَ أعوامَكِ فرحًا",
        "وأن يجعلَ دربَكِ بالأماني مُزهارا",
        "وأن يهبَكِ من السعادةِ أبحرًا",
        "ومن جميلِ الأقدارِ أجملَها اختيارا"
      ],
      [
        "فكلُّ عامٍ وأنتِ قصيدةٌ لا ينتهي سحرُها",
        "ونجمةٌ لا يعرفُ ضوؤها انكسارا",
        "وإن نطقَ الشعرُ يومًا باسمِ الجمالِ",
        "كانت مَارِلين في ختامِ الحُسنِ تذكارا"
      ],
      [
        "لو كانَ للحُسنِ تاجٌ في ممالكِهِ",
        "لكانَ وجهُكِ بينَ الحُسنِ عنوانا"
      ],
      [
        "زهرةً فاقَ عطرُ الحسنِ رونقَها",
        "ويا حكايةَ حُسنٍ زادتِ الآمالا",
        "كلُّ عامٍ وأنتِ بدرٌ في تألّقِهِ",
        "وكلُّ عامٍ يزيدُ الحُسنُ إقبالا"
      ],
      [
        "أنتِ القصيدةُ حينَ الشعرُ يُنشدُها",
        "وأنتِ معنى الهوى إن صارَ تبيانا",
        "---",
        "وإن سألوا عن الجمالِ قلتُ مبتسمًا",
        "بعضُ الجمالِ يُرى، وبعضُهُ وجدانُ"
      ],
      [
        "وَمَا كُلُّ مَنْ يَهْوَى يَعِفُّ إِذَا خَلَا",
        "عَفَافِي وَيُرْضِي الحُبَّ وَالخَيْلُ تَلْجَمُ"
      ],
      [
        "يجثو لها الوردُ مُرحِباً إذا حضرتْ",
        "ويستعيرُ البدرُ من محيّاها أنوارا",
        "كأنّها الفجرُ في ثوبِ الضياءِ بدا",
        "فأيقظَ الحُسنُ في أرجائِها الأزهارا"
      ],
      [
        "لها من البدرِ نورٌ لا يُضاهيهِ",
        "ومن ربيعِ المنى عطرٌ وأسرارُ",
        "إذا تبسّمتْ توارتْ خلفَ ضحكتِها",
        "شموسُ هذا المدى واستيقظَ النّهارُ"
      ]
    ];


    const PALETTE = ["#f9cfd8", "#ffe0cc", "#e4d9f6", "#d6efe3", "#fff0bd", "#d9e8f7"];
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function random(min, max) { return min + Math.random() * (max - min); }
    function pick(list) { return list[Math.floor(Math.random() * list.length)]; }


    /* ---------- Random background shapes (one per grid cell, so they spread out) ---------- */
    (function () {
      const holder = document.getElementById("shapes");
      const types = ["s-circle", "s-ring", "s-blob", "s-star", "s-diamond", "s-plus", "s-circle", "s-blob"];
      const cols = 3;
      const rows = 6;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const el = document.createElement("span");
          const size = random(22, 58);
          el.className = "shape " + pick(types);
          el.style.left = `${(c + random(0.05, 0.75)) * (100 / cols)}%`;
          el.style.top = `${(r + random(0.05, 0.75)) * (100 / rows)}%`;
          el.style.width = el.style.height = `${size}px`;
          el.style.setProperty("--c", pick(PALETTE));
          el.style.setProperty("--dur", `${random(9, 16).toFixed(1)}s`);
          el.style.setProperty("--fx", `${random(-18, 18).toFixed(0)}px`);
          el.style.setProperty("--fy", `${random(-24, 24).toFixed(0)}px`);
          el.style.setProperty("--fr", `${random(-40, 40).toFixed(0)}deg`);
          el.style.animationDelay = `${-random(0, 10).toFixed(1)}s`;
          holder.appendChild(el);
        }
      }
    })();


    /* ---------- Build the cards ---------- */
    const pageTree = document.getElementById("pageTree");
    const pageCards = document.getElementById("pageCards");
    const track = document.getElementById("track");
    const dotsBox = document.getElementById("dots");
    const fx = document.getElementById("fx");

    const cards = [];
    let cakeOut = false;

    function makeCard(inner) {
      const card = document.createElement("article");
      card.className = "card";
      const paper = document.createElement("div");
      paper.className = "paper";
      paper.innerHTML = inner;
      card.appendChild(paper);
      track.appendChild(card);
      cards.push(card);
      return card;
    }

    function setDelays(card, step) {
      card.querySelectorAll(".line, .sep").forEach((el, i) => el.style.setProperty("--d", `${(0.25 + i * step).toFixed(2)}s`));
    }

    // intro
    const intro = makeCard(`
      <span class="orn">✿ ✿ ✿</span>
      <p class="eyebrow line">كل عام وأنتِ بخير</p>
      <h1 class="big-name line">مارلين</h1>
      <p class="sub line">معايدةٌ شعريّة لكِ في يوم ميلادكِ</p>
      <p class="swipe-hint line" id="swipeHint">← اسحبي لتقرئي</p>
    `);
    setDelays(intro, 0.45);

    // poems
    POEMS.forEach((poem) => {
      const html = '<span class="orn">✦</span>' + poem.map((text) =>
        text === "---" ? '<span class="sep">✦ ✦ ✦</span>' : `<span class="line">${text}</span>`
      ).join("");
      const card = makeCard(html);
      setDelays(card, 0.5);
    });

    // closing with a cake
    const closing = makeCard(`
      <span class="orn">✿ ✿ ✿</span>
      <button class="cake-btn" id="cakeBtn" aria-label="اطفئي الشمعة">
        <svg viewBox="0 0 200 170" aria-hidden="true">
          <ellipse cx="100" cy="158" rx="86" ry="9" fill="#f6c9d3"/>
          <rect x="26" y="104" width="148" height="52" rx="12" fill="#f4a6b8"/>
          <path d="M26 114 Q26 104 38 104 H162 Q174 104 174 114 V118 q-9 12 -18 0 q-9 8 -18 0 q-9 12 -18 0 q-9 8 -18 0 q-9 12 -18 0 q-9 8 -18 0 q-9 12 -18 0 q-9 8 -18 0Z" fill="#fff"/>
          <rect x="54" y="66" width="92" height="42" rx="10" fill="#ffd9b8"/>
          <rect x="54" y="66" width="92" height="11" rx="5.5" fill="#fff"/>
          <rect x="78" y="40" width="7" height="26" rx="2" fill="#e4d9f6"/>
          <rect x="96.5" y="40" width="7" height="26" rx="2" fill="#f9cfd8"/>
          <rect x="115" y="40" width="7" height="26" rx="2" fill="#d6efe3"/>
          <g transform="translate(81.5 38)"><path class="flame" d="M0 -13 C5 -7 6 -2 0 3 C-6 -2 -5 -7 0 -13Z" fill="#ffb347"/></g>
          <g transform="translate(100 38)"><path class="flame" d="M0 -13 C5 -7 6 -2 0 3 C-6 -2 -5 -7 0 -13Z" fill="#ffb347"/></g>
          <g transform="translate(118.5 38)"><path class="flame" d="M0 -13 C5 -7 6 -2 0 3 C-6 -2 -5 -7 0 -13Z" fill="#ffb347"/></g>
        </svg>
      </button>
      <p class="eyebrow line">كل عام وأنتِ بخير يا مارلين</p>
      <p class="sub line wish-line" id="wishLine">المسي الشمعة وتمنّي أمنيتكِ</p>
      <p class="sub line">بكل الحب — ${SENDER}</p>
    `);
    setDelays(closing, 0.5);

    cards.forEach((card, i) => {
      const dot = document.createElement("button");
      dot.className = "dot" + (i === 0 ? " on" : "");
      dot.setAttribute("aria-label", "بطاقة " + (i + 1));
      dot.addEventListener("click", () => card.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" }));
      dotsBox.appendChild(dot);
    });


    /* ---------- Reveal the lines of the card that is on screen ---------- */
    let cardsOn = false;
    let current = 0;

    function reveal(index) {
      cards[index].classList.add("in");
      dotsBox.querySelectorAll(".dot").forEach((dot, i) => dot.classList.toggle("on", i === index));
      if (index > 0) {
        const hint = document.getElementById("swipeHint");
        if (hint) hint.style.visibility = "hidden";
      }
    }

    new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        current = cards.indexOf(entry.target);
        if (cardsOn) reveal(current);
      });
    }, { root: track, threshold: 0.6 }).observe(cards[0]);

    const cardObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        current = cards.indexOf(entry.target);
        if (cardsOn) reveal(current);
      });
    }, { root: track, threshold: 0.6 });
    cards.forEach((card) => cardObserver.observe(card));


    /* ---------- Falling petals (start after the tree) ---------- */
    const petalsBox = document.getElementById("petals");
    const PETAL_COLORS = ["#f9cfd8", "#f4a6b8", "#ffd9b8", "#e4d9f6", "#fff0bd"];
    let petalsStarted = false;

    function spawnPetal() {
      if (document.hidden) return;
      const petal = document.createElement("span");
      const size = random(9, 17);
      petal.className = "petal";
      petal.style.left = `${random(-4, 100)}vw`;
      petal.style.width = `${size}px`;
      petal.style.height = `${size}px`;
      petal.style.setProperty("--c", pick(PETAL_COLORS));
      petal.style.setProperty("--dur", `${random(9, 15).toFixed(1)}s`);
      petal.style.setProperty("--dx", `${random(-80, 80).toFixed(0)}px`);
      petal.style.setProperty("--rot", `${random(-300, 300).toFixed(0)}deg`);
      petal.addEventListener("animationend", () => petal.remove());
      petalsBox.appendChild(petal);
    }

    function startPetals() {
      if (petalsStarted || reduceMotion) return;
      petalsStarted = true;
      for (let i = 0; i < 5; i++) setTimeout(spawnPetal, i * 350);
      setInterval(spawnPetal, 1100);
    }


    /* ---------- Confetti + tap flowers ---------- */
    const CONFETTI = ["#f4a6b8", "#f9cfd8", "#ffd9b8", "#c8a24e", "#e4d9f6", "#d6efe3", "#fff0bd"];

    function confetti(count, x, y) {
      const total = reduceMotion ? Math.min(count, 10) : count;

      for (let i = 0; i < total; i++) {
        const el = document.createElement("i");
        const size = random(6, 11);
        el.className = "confetto";
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        el.style.width = `${size}px`;
        el.style.height = `${(size * random(0.5, 1.3)).toFixed(1)}px`;
        el.style.background = pick(CONFETTI);
        el.style.borderRadius = Math.random() < 0.4 ? "50%" : "2px";
        fx.appendChild(el);

        const angle = random(-Math.PI * 0.95, -Math.PI * 0.05);
        const dist = random(90, 260);
        const dx = Math.cos(angle) * dist;
        const dy = Math.sin(angle) * dist;

        const anim = el.animate([
          { transform: "translate(0, 0) rotate(0deg)", opacity: 1 },
          { offset: 0.45, transform: `translate(${dx}px, ${dy}px) rotate(${random(-360, 360)}deg)`, opacity: 1 },
          { transform: `translate(${dx * 1.2}px, ${dy + 260}px) rotate(${random(-540, 540)}deg)`, opacity: 0 }
        ], { duration: random(1500, 2400), easing: "cubic-bezier(0.2, 0.7, 0.4, 1)", fill: "forwards" });

        anim.onfinish = () => el.remove();
      }
    }

    document.addEventListener("pointerdown", (e) => {
      if (e.target.closest("#musicToggle") || e.target.closest(".dot")) return;

      const flower = document.createElement("span");
      flower.className = "tap-flower";
      flower.textContent = "✿";
      flower.style.left = `${e.clientX}px`;
      flower.style.top = `${e.clientY}px`;
      flower.style.fontSize = `${random(1, 1.7).toFixed(2)}rem`;
      flower.style.color = pick(["#f4a6b8", "#e9a3b4", "#c8a24e", "#c7b3ea"]);
      document.body.appendChild(flower);

      const dx = random(-30, 30);
      flower.animate([
        { transform: "translate(-50%, -50%) scale(0.4)", opacity: 0 },
        { offset: 0.2, opacity: 1 },
        { transform: `translate(calc(-50% + ${dx}px), calc(-50% - 80px)) scale(1.1)`, opacity: 0 }
      ], { duration: 1100, easing: "ease-out", fill: "forwards" }).onfinish = () => flower.remove();
    });


    /* ---------- Cake: blow out the candles ---------- */
    document.getElementById("cakeBtn").addEventListener("click", (e) => {
      if (cakeOut) return;
      cakeOut = true;
      e.currentTarget.classList.add("out");

      const wish = document.getElementById("wishLine");
      const rect = e.currentTarget.getBoundingClientRect();
      confetti(34, rect.left + rect.width / 2, rect.top + rect.height * 0.3);

      wish.style.opacity = 0;
      setTimeout(() => {
        wish.textContent = "تمنّي أمنيتكِ ✨ ربّنا يحققها كلها";
        wish.style.opacity = 1;
      }, 800);
    });


    /* ---------- Tree: tap to grow, then go to the poems ---------- */
    (function () {
      const NS = "http://www.w3.org/2000/svg";
      const btn = document.getElementById("treeBtn");
      const treeG = document.getElementById("tree-g");
      const branches = document.getElementById("branches");
      const blooms = document.getElementById("blooms");
      const hint = document.getElementById("treeHint");

      const GROUND = 292;
      const MAXD = 5;
      const MAX_BLOOMS = 48;
      const FLOWER = "M0 -7 C3 -7 5 -4 3.5 -1.5 C6 -2 8 1 5.5 3.5 C5.5 6 2 7 0 5 C-2 7 -5.5 6 -5.5 3.5 C-8 1 -6 -2 -3.5 -1.5 C-5 -4 -3 -7 0 -7Z";
      const COLS = ["#f4a6b8", "#f7c1cf", "#ffc9a3", "#e2b8ea", "#f9a8c0", "#ffd98a"];
      const items = [];
      const tips = [];

      function mk(tag, attrs) {
        const el = document.createElementNS(NS, tag);
        for (const key in attrs) el.setAttribute(key, attrs[key]);
        return el;
      }

      // Each branch starts when its parent finishes; right-hand branches wait a bit longer,
      // so the tree grows in order instead of all together.
      function grow(x, y, ang, len, d, t0) {
        const x2 = x + Math.sin(ang) * len;
        const y2 = y - Math.cos(ang) * len;
        const vx = x2 - x;
        const vy = y2 - y;
        const nx = -vy / len;
        const ny = vx / len;
        const bend = (Math.random() - 0.5) * len * 0.3;
        const c1x = x + vx * 0.33 + nx * bend;
        const c1y = y + vy * 0.33 + ny * bend;
        const c2x = x + vx * 0.66 - nx * bend * 0.5;
        const c2y = y + vy * 0.66 - ny * bend * 0.5;

        const path = mk("path", {
          d: `M${x.toFixed(1)} ${y.toFixed(1)} C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`,
          "stroke-width": Math.max(1, (MAXD - d + 1) * 1.35)
        });
        branches.appendChild(path);

        const length = path.getTotalLength();
        path.style.strokeDasharray = length;
        path.style.strokeDashoffset = d === 0 ? 0 : length;

        const dur = d === 0 ? 0 : 0.5 - d * 0.05;
        const end = t0 + dur;
        items.push({ path, d, t0, dur });

        if (d < MAXD) {
          for (let i = 0; i < 2; i++) {
            const side = i === 0 ? -1 : 1;
            const wait = i === 0 ? 0 : (MAXD - d) * 0.15;
            grow(x2, y2, ang + side * (0.28 + Math.random() * 0.26) + (Math.random() - 0.5) * 0.08, len * (0.75 + Math.random() * 0.05), d + 1, end + wait);
          }
          if (d >= 2 && Math.random() < 0.7) {
            tips.push({ x: x2, y: y2, t: end });
            if (d >= 3) tips.push({ x: x2 + (Math.random() - 0.5) * 12, y: y2 + (Math.random() - 0.5) * 12, t: end });
          }
        } else {
          for (let k = 0; k < 3; k++) {
            tips.push({ x: x2 + (Math.random() - 0.5) * 16, y: y2 + (Math.random() - 0.5) * 16, t: end });
          }
        }
      }

      grow(120, GROUND, 0, 66, 0, 0.3);

      const flowers = tips.sort(() => Math.random() - 0.5).slice(0, MAX_BLOOMS).map((tip) => {
        const scale = 0.7 + Math.random() * 0.5;
        const group = mk("g", { transform: `translate(${tip.x.toFixed(1)} ${tip.y.toFixed(1)}) scale(${scale.toFixed(2)}) rotate(${(Math.random() * 72).toFixed(0)})` });
        const bloom = mk("path", { d: FLOWER, class: "bloom" });
        bloom.style.fill = pick(COLS);
        bloom.style.fillOpacity = (0.85 + Math.random() * 0.13).toFixed(2);
        group.appendChild(bloom);
        blooms.appendChild(group);
        return { group, bloom, x: tip.x, y: tip.y, scale, t: tip.t };
      });

      let started = false;

      btn.addEventListener("click", () => {
        if (started) return;
        started = true;
        btn.classList.add("growing");
        hint.classList.add("gone");

        treeG.style.transition = "transform 4.2s cubic-bezier(0.25, 0.6, 0.3, 1)";
        treeG.style.transform = "scale(1)";

        items.forEach((item) => {
          if (item.d > 0) {
            item.path.style.transition = `stroke-dashoffset ${item.dur.toFixed(2)}s ease-in-out ${item.t0.toFixed(2)}s`;
            item.path.style.strokeDashoffset = 0;
          }
        });

        // each flower opens right after its own branch finishes growing
        flowers.forEach((o) => {
          o.at = Math.round(o.t * 1000 + 150 + Math.random() * 150);
          setTimeout(() => o.bloom.classList.add("on"), o.at);
        });

        // a few flowers drift down to the ground
        const fallers = flowers
          .filter((o) => o.at <= 3800)
          .sort(() => Math.random() - 0.5)
          .slice(0, 10);
        let endMs = 6500;

        fallers.forEach((o, i) => {
          const start = Math.max(3600 + i * 140, o.at + 1500) + Math.random() * 300;
          const dur = 2600 + Math.random() * 1400;
          endMs = Math.max(endMs, start + dur);

          setTimeout(() => {
            const sway = 10 + Math.random() * 12;
            const dx = (Math.random() - 0.5) * 40;
            const dy = (GROUND - 2 - Math.random() * 8) - o.y;
            const rot = (Math.random() - 0.5) * 140;
            const T = (x, y, r) => `translate(${x}px, ${y}px) scale(${o.scale}) rotate(${r}deg)`;

            o.group.animate([
              { transform: T(o.x, o.y, 0), opacity: 1 },
              { offset: 0.3, transform: T(o.x + sway, o.y + dy * 0.3, rot * 0.3), opacity: 1 },
              { offset: 0.65, transform: T(o.x - sway * 0.6 + dx * 0.5, o.y + dy * 0.7, rot * 0.7), opacity: 1 },
              { transform: T(o.x + dx, o.y + dy, rot), opacity: 0.8 }
            ], { duration: dur, easing: "cubic-bezier(0.37, 0, 0.63, 1)", fill: "forwards" });
          }, start);
        });

        setTimeout(() => {
          pageTree.classList.remove("active");
          pageCards.classList.add("active");
          startPetals();

          setTimeout(() => {
            cardsOn = true;
            reveal(current);
            confetti(30, window.innerWidth / 2, window.innerHeight * 0.55);
          }, 500);
        }, endMs - 300);
      });
    })();


    /* ---------- Music: song.mp3 for the whole site ---------- */
    (function () {
      const audio = document.getElementById("bgm");
      const toggle = document.getElementById("musicToggle");
      const TARGET = 0.5;
      let muted = false;
      let fadeTimer = null;

      try { muted = localStorage.getItem("marilyn-music") === "off"; } catch (e) {}
      toggle.classList.toggle("off", muted);
      audio.volume = 0;

      function fade(to, ms, done) {
        clearInterval(fadeTimer);
        const from = audio.volume;
        const steps = 20;
        let i = 0;

        fadeTimer = setInterval(() => {
          i++;
          audio.volume = Math.max(0, Math.min(1, from + (to - from) * i / steps));
          if (i >= steps) {
            clearInterval(fadeTimer);
            if (done) done();
          }
        }, ms / steps);
      }

      const wanted = () => !muted && !document.hidden;

      function sync() {
        if (wanted()) {
          if (audio.paused) {
            audio.play().then(() => fade(TARGET, 1400)).catch(() => {});
          } else {
            fade(TARGET, 1400);
          }
        } else {
          fade(0, 600, () => { if (!wanted()) audio.pause(); });
        }
      }

      // Browsers block sound until the first touch, so start on the first tap
      const events = ["pointerdown", "touchend", "click", "keydown"];

      function cleanup() {
        events.forEach((ev) => document.removeEventListener(ev, firstGesture, true));
      }

      function firstGesture(e) {
        if (e.target.closest && e.target.closest("#musicToggle")) return;
        if (!wanted()) return;
        audio.play().then(() => {
          fade(TARGET, 1400);
          cleanup();
        }).catch(() => {});
      }

      events.forEach((ev) => document.addEventListener(ev, firstGesture, true));

      toggle.addEventListener("click", () => {
        muted = !muted;
        toggle.classList.toggle("off", muted);
        try { localStorage.setItem("marilyn-music", muted ? "off" : "on"); } catch (e) {}
        sync();
      });

      document.addEventListener("visibilitychange", sync);
    })();
  </script>
</body>
